<!-- login.html -->

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>으차방 벙 게임</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container">

        <h1>으차방 벙 게임</h1>

        <input
            type="text"
            id="nickname"
            placeholder="닉네임을 입력하세요."
            maxlength="2">

        <button id="enterBtn">
            입장하기
        </button>

    </div>

    <!-- 비밀번호 입력 모달 -->
    <div id="passwordModal" class="modal hidden">

        <div class="modalBox">

            <button
                type="button"
                class="modalClose"
                id="passwordCancelBtn"
                aria-label="닫기">
            </button>

            <h3>
                🔑 으차방 벙 게임 로그인
            </h3>

            <input
                type="password"
                id="accessPassword"
                placeholder="비밀번호를 입력하세요."
                maxlength="20">

            <button id="passwordOkBtn">
                로그인
            </button>

        </div>

    </div>

    <!-- 날짜 선택 모달 -->
    <div id="dateModal" class="modal hidden">

        <div class="modalBox">

            <button
                type="button"
                class="modalClose"
                id="dateCancelBtn"
                aria-label="닫기">
            </button>

            <h3>
                벙 날짜 선택
            </h3>

            <div class="dateButton">

                <button id="todayBtn"></button>
                <button id="yesterdayBtn"></button>

            </div>

        </div>

    </div>

    <!-- 경고 모달 -->
    <div id="warningModal" class="modal hidden">

        <div class="modalBox warningBox">

            <p id="warningText"></p>

        </div>

    </div>

    <!-- 하단 안내 -->
    <div class="footerInfo">

        <div class="footerTitle">
            카카오톡 오픈채팅
        </div>

        <a
            href="https://open.kakao.com/o/g7b2DGti"
            target="_blank">
            8090 으차방
        </a>

        <div class="footerManager">
            <span>운영관리담당 : 코코</span>
            <span class="version" id="version"></span>
        </div>

    </div>

    <script type="module" src="login.js"></script>

</body>

</html>
